
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coming Soon | HCI Solutions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="HCI Solutions - Strategic partnership consultancy specializing in fractional business operations and strategy." />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy-blue: #1c3a52;
      --dark-gray: #5a6570;
      --light-gray: #f5f5f5;
      --white: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--navy-blue) 0%, var(--dark-gray) 100%);
      color: var(--white);
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 3rem;
      color: var(--white);
    }

    h1 {
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: -1px;
      color: var(--white);
    }

    p {
      font-size: 1.3rem;
      opacity: 0.9;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 3rem;
      }
      
      .logo {
        font-size: 2rem;
      }
      
      p {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">HCI Solutions</div>
    <h1>Coming Soon</h1>
    <p>Strategic partnership consultancy and business operations excellence.</p>
  </div>
</body>
</html>
